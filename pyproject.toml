[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cgan-research"
version = "0.1.0"
description = "Reproducible calendar-conditioned electricity profile experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.1", "scipy>=1.10", "torch>=2.2", "matplotlib>=3.7", "PyYAML>=6", "requests>=2.31"]

[project.optional-dependencies]
test = ["pytest>=8", "nbformat>=5"]

[project.scripts]
cgan-research = "cgan_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
